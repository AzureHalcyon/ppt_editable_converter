[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-editable-converter"
version = "0.1.0"
description = "Batch-convert PowerPoint presentations through Microsoft PowerPoint COM automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
ppt-editable-convert = "convert_editable:main"

[tool.setuptools]
py-modules = ["convert_editable"]
